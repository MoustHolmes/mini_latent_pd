model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null
  filename: "step_{step:06d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true
  every_n_train_steps: null
  every_n_epochs: 1
  verbose: false

lr_monitor:
  _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: step

rmsd_validation:
  _target_: mini_latent_pd.callbacks.rmsd_validation.DynamicsRMSDCallback
